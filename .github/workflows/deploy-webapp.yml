name: Build and deploy to Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish Peach.TriathlonShop.App.Server/Peach.TriathlonShop.App.Server.csproj -c Release -o publish

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: "app-triathlonshop-dev-peach"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish